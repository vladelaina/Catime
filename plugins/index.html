<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="浏览并下载经过校验的 Catime 插件脚本。">
    <title>Catime - 插件库</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vladelaina.github.io" crossorigin>
    <link rel="preload" href="https://vladelaina.github.io/Catime-Plugins/api/v1/catalog.json" as="fetch" type="application/json" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </noscript>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/plugins/styles/plugins.css">
    <link rel="icon" type="image/png" href="/assets/catime.webp">

    <script vite-ignore src="/scripts/config.js" defer></script>
    <script vite-ignore src="/scripts/ui-utils.js" defer></script>
    <script vite-ignore src="/scripts/components.js" data-auto-load defer></script>
    <script vite-ignore src="/scripts/navigation.js" defer></script>
    <script src="/plugins/scripts/plugins.js" type="module"></script>
</head>
<body class="plugin-library-page">
    <header class="main-header"></header>

    <main>
        <section class="plugin-workspace" aria-labelledby="pluginCatalogTitle">
            <div class="container">
                <h1 class="visually-hidden" id="pluginCatalogTitle">插件目录</h1>
                <div class="plugin-grid" id="pluginGrid" aria-live="polite" aria-busy="true">
                    <div class="plugin-loading" id="pluginLoading">
                        <span></span><span></span><span></span>
                        <p id="pluginLoadingText">正在加载插件目录…</p>
                    </div>
                </div>

                <div class="plugin-empty" id="pluginEmpty" hidden>
                    <i class="fas fa-filter-circle-xmark" aria-hidden="true"></i>
                    <h3 id="pluginEmptyTitle">没有匹配的插件</h3>
                    <p id="pluginEmptyDescription">尝试调整搜索词或筛选条件。</p>
                </div>

                <div class="plugin-error" id="pluginError" hidden role="alert">
                    <i class="fas fa-cloud-arrow-down" aria-hidden="true"></i>
                    <div>
                        <h3 id="pluginErrorTitle">暂时无法读取插件目录</h3>
                        <p id="pluginErrorDescription">请稍后重试，或前往 GitHub 插件仓库。</p>
                    </div>
                    <button type="button" id="pluginRetry">
                        <i class="fas fa-rotate-right" aria-hidden="true"></i>
                        <span id="pluginRetryText">重新加载</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div class="plugin-toast" id="pluginToast" role="status" aria-live="polite" hidden></div>
</body>
</html>
