; 番茄钟阶段钩子配置，运行时位于主 config.ini 的同一目录。
; 文件不存在时，钩子会自动创建默认配置；修改在下一次进入阶段时生效。
; Color 支持 DEFAULT（当前默认颜色）、HEX、RGB、颜色名称和渐变。
; SoundFile 默认使用 SYSTEM_BEEP（系统提示音），也支持绝对路径和相对本文件的路径。
; DEFAULT 使用当前通知音；通知音未设置时回退到系统提示音。
; SoundFile 留空表示静音；实际执行哪些动作仍由“状态动作配置”的勾选控制。
; 短休息使用浅青到浅蓝渐变，长休息使用青绿到亮绿渐变，取自默认色板。

[Work]
Color=DEFAULT
SoundFile=SYSTEM_BEEP

[ShortBreak]
Color=#89F7FE_#66A6FF
SoundFile=SYSTEM_BEEP

[LongBreak]
Color=#10BD92_#8CE442
SoundFile=SYSTEM_BEEP
