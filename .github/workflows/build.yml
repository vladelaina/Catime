name: Manual Code Signing

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Source GitHub repository URL or owner/repo (latest stable release)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: write

jobs:
  download:
    if: github.repository == 'vladelaina/Catime' && github.ref == 'refs/heads/temp'
    runs-on: ubuntu-latest
    outputs:
      filenames: ${{ steps.release.outputs.filenames }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Download latest stable Windows release
        id: release
        uses: actions/github-script@v8
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const input = process.env.SOURCE_REPOSITORY.trim();
            const match = /^(?:https:\/\/github\.com\/)?([A-Za-z0-9-]+)\/([A-Za-z0-9_.-]+?)\/?$/.exec(input);
            if (!match) {
              throw new Error('Enter a GitHub repository URL or owner/repo.');
            }
            const owner = match[1];
            const repo = match[2].replace(/\.git$/, '');
            if (!repo || repo === '.' || repo === '..') {
              throw new Error('Invalid repository name.');
            }
            const { data: release } = await github.rest.repos.getLatestRelease({ owner, repo });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            const selected = [];
            for (const arch of ['x64', 'x86']) {
              for (const kind of ['portable', 'setup']) {
                const suffix = `-windows-${arch}-${kind}.exe`;
                const matches = assets.filter(asset =>
                  asset.name.endsWith(suffix) && asset.size > 0);
                if (matches.length !== 1) {
                  throw new Error(`Expected exactly one nonempty *${suffix} asset; found ${matches.length}.`);
                }
                const asset = matches[0];
                if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(asset.name)) {
                  throw new Error(`Unsupported asset filename: ${asset.name}`);
                }
                selected.push(asset);
              }
            }
            fs.mkdirSync('unsigned', { recursive: true });
            const rows = [];
            for (const asset of selected) {
              await exec.exec('gh', ['release', 'download', release.tag_name,
                '--repo', `${owner}/${repo}`, '--pattern', asset.name, '--dir', 'unsigned']);
              const bytes = fs.readFileSync(`unsigned/${asset.name}`);
              if (bytes.length !== asset.size || bytes.subarray(0, 2).toString() !== 'MZ') {
                throw new Error(`Invalid executable or size mismatch: ${asset.name}`);
              }
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (asset.digest && asset.digest !== `sha256:${digest}`) {
                throw new Error(`Release digest mismatch: ${asset.name}`);
              }
              rows.push([asset.name, digest]);
            }
            core.setOutput('filenames', JSON.stringify(selected.map(asset => asset.name)));
            await core.summary
              .addHeading('Signing source')
              .addLink(`${owner}/${repo} — ${release.tag_name}`, release.html_url)
              .addTable([['Executable', 'SHA-256'], ...rows])
              .write();

      - name: Upload signing input
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: catime-signing-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned/*.exe
          if-no-files-found: error
          archive: true
          compression-level: 0
          retention-days: 1

  sign:
    if: github.repository == 'vladelaina/Catime' && github.ref == 'refs/heads/temp'
    needs: download
    runs-on: ubuntu-latest
    outputs:
      signed-artifact-id: ${{ steps.upload-signed.outputs.artifact-id }}
    steps:
      - name: Submit four executables with a separate artifact configuration
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '66aa6e96-a394-43f9-b3c3-65214fcd285d'
          project-slug: 'Catime'
          signing-policy-slug: 'windows-four-exe'
          # Create this separate configuration in SignPath using
          # .github/signpath/windows-four-exe.xml; keep the default unchanged.
          artifact-configuration-slug: 'windows-four-exe'
          github-artifact-id: ${{ needs.download.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-output'

      - name: Upload signed executables
        id: upload-signed
        uses: actions/upload-artifact@v7
        with:
          name: windows-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-output/*.exe
          if-no-files-found: error
          retention-days: 90

  verify:
    needs: [download, sign]
    runs-on: windows-latest
    steps:
      - name: Download signed executables
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.sign.outputs.signed-artifact-id }}
          path: signed

      - name: Verify all four Authenticode signatures
        shell: pwsh
        env:
          FILENAMES: ${{ needs.download.outputs.filenames }}
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(ConvertFrom-Json $env:FILENAMES)
          $files = @(Get-ChildItem -LiteralPath signed -File -Recurse)
          if ($names.Count -ne 4 -or $files.Count -ne 4) {
            throw 'Expected exactly four signed executables.'
          }
          foreach ($name in $names) {
            $file = Get-Item -LiteralPath "signed/$name"
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid signature for ${name}: $($signature.Status) - $($signature.StatusMessage)"
            }
            "- Verified: $name" >> $env:GITHUB_STEP_SUMMARY
          }
